<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Firas Alzarouq - Network and Telecommunication Engineer, Infrastructure Specialist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0d1f2d"/>
      <stop offset="1" stop-color="#0f3a2c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fe3c0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4a0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- Libyan flag stripe: red / black / green -->
    <rect x="0" y="0" width="1200" height="3" fill="#e70013"/>
    <rect x="0" y="3" width="1200" height="5" fill="#000000"/>
    <rect x="0" y="8" width="1200" height="3" fill="#239e46"/>

    <!-- Network graph -->
    <circle cx="950" cy="165" r="150" fill="url(#glow)"/>
    <g stroke="#3fb68b" stroke-opacity="0.55" stroke-width="1.6" fill="none">
      <line x1="950" y1="165" x2="800" y2="80"/>
      <line x1="950" y1="165" x2="880" y2="270"/>
      <line x1="950" y1="165" x2="1080" y2="70"/>
      <line x1="950" y1="165" x2="1110" y2="210"/>
      <line x1="950" y1="165" x2="780" y2="195"/>
      <line x1="950" y1="165" x2="1010" y2="285"/>
      <line x1="800" y1="80" x2="1080" y2="70" stroke-dasharray="4 6" stroke-opacity="0.3"/>
      <line x1="780" y1="195" x2="880" y2="270" stroke-dasharray="4 6" stroke-opacity="0.3"/>
      <line x1="1110" y1="210" x2="1010" y2="285" stroke-dasharray="4 6" stroke-opacity="0.3"/>
    </g>

    <!-- Moving packets -->
    <g fill="#7fe3c0">
      <circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite" path="M950,165 L800,80"/></circle>
      <circle r="3.5"><animateMotion dur="3.6s" repeatCount="indefinite" path="M880,270 L950,165"/></circle>
      <circle r="3.5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M950,165 L1080,70"/></circle>
      <circle r="3.5"><animateMotion dur="3.3s" repeatCount="indefinite" path="M1110,210 L950,165"/></circle>
      <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" path="M950,165 L780,195"/></circle>
      <circle r="3.5"><animateMotion dur="3.1s" repeatCount="indefinite" path="M1010,285 L950,165"/></circle>
    </g>

    <!-- Outer nodes -->
    <g fill="#0d1f2d" stroke="#5ab0ff" stroke-width="2">
      <circle cx="800" cy="80" r="11"/>
      <circle cx="880" cy="270" r="11"/>
      <circle cx="1080" cy="70" r="11"/>
      <circle cx="1110" cy="210" r="11"/>
      <circle cx="780" cy="195" r="11"/>
      <circle cx="1010" cy="285" r="11"/>
    </g>
    <g fill="#5ab0ff">
      <circle cx="800" cy="80" r="4"/>
      <circle cx="880" cy="270" r="4"/>
      <circle cx="1080" cy="70" r="4"/>
      <circle cx="1110" cy="210" r="4"/>
      <circle cx="780" cy="195" r="4"/>
      <circle cx="1010" cy="285" r="4"/>
    </g>

    <!-- Hub: hexagon with helm-wheel feel -->
    <g transform="translate(950 165)">
      <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#0b1a26" stroke="#2dd4a0" stroke-width="3">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
      </polygon>
      <g stroke="#7fe3c0" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-24" x2="0" y2="24"/>
        <line x1="-21" y1="-12" x2="21" y2="12"/>
        <line x1="-21" y1="12" x2="21" y2="-12"/>
      </g>
      <circle r="9" fill="#0b1a26" stroke="#7fe3c0" stroke-width="2.5"/>
      <circle r="3" fill="#7fe3c0"/>
    </g>

    <!-- Text -->
    <text x="60" y="108" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#2dd4a0">$ kubectl get engineer<tspan fill="#7fe3c0">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text>

    <text x="60" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="url(#name)">FIRAS ALZAROUQ</text>

    <text x="62" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#cfe3ee" letter-spacing="3">INFRASTRUCTURE SPECIALIST</text>
  </g>
</svg>
